# Copy into the consuming repo's .github/workflows/ next to the workflow that
# calls the ensure action. Uses the same three secrets. This is the Hetzner
# version; for OVH, which bills by runtime, see examples/reaper-ovh.yml.
#
# Deletes the pool's idle VMs in the last minutes of their paid hour. The window
# is the last 10 minutes by default, so this must run at least every 5 minutes:
# a VM that is missed is billed a second full hour.
#
# Where it runs matters for cost. On a GitHub-hosted runner every run bills at
# least one minute, and every 5 minutes is about 8,600 runs a month, which is
# far past the free allowance of a private repo. A self-hosted runner is free.
# The trade-off is that if it is offline, VMs are not reaped and each one that
# was due costs one extra paid hour.

name: reap idle VMs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  reap:
    # NOT a pool runner. The pool's own runners are self-hosted too, so a bare
    # `self-hosted` can land this job on one of them; the reaper then makes that
    # runner busy and keeps the server it is meant to delete, tick after tick.
    # Give your own (non-pool) runners a custom label and list it here, e.g.
    # `runs-on: [self-hosted, my-laptop]`. Pool runners carry only `self-hosted`,
    # `vm-gh-runners` and `pool-<pool>`.
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: karimn/vm-gh-runners/reap@main
        with:
          pool: ci
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.VGR_GITHUB_TOKEN }}
