# The OVH Public Cloud version of examples/use-in-a-workflow.yml. Copy into the
# consuming repo's .github/workflows/ and adapt.
#
# Run tests on a VM of their own. The first job creates this run's VM (run-id is
# the workflow run's id, so two runs never share one) and makes sure its runners
# are up; the second runs on those runners; the `teardown` job at the end runs
# the reap action with the same run-id and deletes the VM. OVH bills a server for
# the time it exists, so there is no paid hour to wait out.
#
# One VM per run means concurrent runs never collide: each has its own runners,
# labelled run-<id>, and one run's teardown cannot delete another run's VM.
# The price is capacity: every in-flight run holds a VM, so the project's quota
# caps concurrent runs (a b3-32 is 8 vCPU; a 34-core quota shared with other
# consumers fits about 3-4). When the quota is full, ensure fails at once and
# names it; it does not wait. The scheduled reaper (examples/reaper-ovh.yml) is
# the safety net for runs that never reach teardown, such as a cancelled one: it
# deletes a per-run VM once its run is no longer queued or in progress.
#
# Re-running: use "Re-run all jobs". "Re-run failed jobs" does not work here:
# GitHub skips the successful vm job and reuses its old runs_on output, but
# teardown already deleted that VM, so the re-run jobs wait on runner labels that
# no longer exist. Use one mode per pool: every workflow that uses this pool must
# pass run-id (a shared-mode job could land on another run's runners).
#
# Secrets to add to the repo (Settings > Secrets and variables > Actions):
#   OVH_APPLICATION_CREDENTIAL_ID      Application credential, created as UNRESTRICTED
#   OVH_APPLICATION_CREDENTIAL_SECRET  (a restricted one cannot create servers).
#                                      Shown once, in Public Cloud > Users & Roles.
#   VGR_GITHUB_TOKEN                   Fine-grained PAT for this repo with Administration: read and write and Actions: read.
#   VGR_SSH_PRIVATE_KEY                Private key whose public half is uploaded to the OVH
#                                      project as a key pair named like ssh-key-names below,
#                                      IN THE SAME REGION as `location`. A fresh key used for
#                                      nothing else, with no passphrase.

name: tests on a pooled OVH VM

on:
  pull_request:

jobs:
  vm:
    # This job only makes API calls and SSHes in briefly. It cannot land on a
    # pool VM (pool runners do not carry self-hosted), but it must not wait on
    # one either: a GitHub-hosted runner is always there.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      runs_on: ${{ steps.ensure.outputs.runs_on }}
    steps:
      - id: ensure
        uses: karimn/vm-gh-runners/ensure@main
        with:
          pool: ci
          run-id: ${{ github.run_id }}
          provider: ovh # the default; shown for clarity
          # The OVH US account's Keystone (https://auth.cloud.ovh.us/v3) and
          # region (US-EAST-VA-1) are the defaults. An EU account sets
          # ovh-auth-url (https://auth.cloud.ovh.net/v3) and a location such as GRA11.
          location: US-EAST-VA-1
          # An OVH flavor. b3-32 is 8 vCPU / 32 GB. A pool of 8 runners that
          # averages 39% of 16 vCPUs needs about 6 cores, so that is tight; look
          # in the manager at what 16 vCPU / 32 GB flavor your region offers.
          server-type: b3-32
          # Exactly one key pair name (Nova takes one per server).
          ssh-key-names: ci-key
          ssh-private-key: ${{ secrets.VGR_SSH_PRIVATE_KEY }}
          ovh-application-credential-id: ${{ secrets.OVH_APPLICATION_CREDENTIAL_ID }}
          ovh-application-credential-secret: ${{ secrets.OVH_APPLICATION_CREDENTIAL_SECRET }}
          github-token: ${{ secrets.VGR_GITHUB_TOKEN }}
          runner-count: 6
          # Pin for repeatable VMs.
          runner-version: 2.337.0

  test:
    needs: vm
    runs-on: ${{ fromJSON(needs.vm.outputs.runs_on) }}
    steps:
      - uses: actions/checkout@v4

  # Runs even if the vm job or the tests failed or were cancelled (reap with a
  # run-id is a no-op when the run has no VM). It must not run on a pool runner,
  # where it would be the busy runner that makes reap keep the server. Pool
  # runners do not carry `self-hosted`, so a self-hosted runner of your own works
  # too; a GitHub-hosted one is always available, about a minute billed. It must
  # be the run's last job: with run-id, reap does not count the run itself as
  # active, and deletes the run's VM as soon as no runner on it is busy.
  teardown:
    needs: [vm, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: karimn/vm-gh-runners/reap@main
        with:
          pool: ci
          run-id: ${{ github.run_id }}
          provider: ovh # the default; shown for clarity
          location: US-EAST-VA-1
          ovh-application-credential-id: ${{ secrets.OVH_APPLICATION_CREDENTIAL_ID }}
          ovh-application-credential-secret: ${{ secrets.OVH_APPLICATION_CREDENTIAL_SECRET }}
          github-token: ${{ secrets.VGR_GITHUB_TOKEN }}
