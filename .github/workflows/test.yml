name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Public repo, so GitHub-hosted minutes are free.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
