name: vm-gh-runners ensure
description: >-
  Reuse or create a pooled VM and make sure its GitHub Actions runners are
  registered, so later jobs can run on it. Safe to call from any number of
  runs at once; do not add a `concurrency:` group for it, because GitHub
  cancels all but the newest pending job in a group.

inputs:
  pool:
    description: Names a group of servers. One pool per kind of workload.
    required: true
  server-type:
    description: >-
      Provider size. A Hetzner server type such as cpx62, or an OVH flavor such
      as b3-32.
    required: true
  ssh-key-names:
    description: >-
      Comma-separated names or IDs of SSH keys already uploaded to the cloud
      project. OVH takes exactly one, a key pair that exists in the region.
    required: true
  ssh-private-key:
    description: The private half of that key. Pass it from a secret.
    required: true
  provider:
    description: >-
      Cloud to run on, ovh or hetzner. Defaults to ovh. Each needs its own
      credentials, below; the other provider's can be left unset. A caller that
      uses Hetzner must set this to hetzner.
    required: false
  hcloud-token:
    description: Hetzner project API token (read and write). Required when provider is hetzner. Pass it from a secret.
    required: false
  ovh-application-credential-id:
    description: >-
      ID of an OVH application credential created as unrestricted, so it can
      create and delete servers. Required when provider is ovh.
    required: false
  ovh-application-credential-secret:
    description: Secret of that OVH application credential. Required when provider is ovh. Pass it from a secret.
    required: false
  ovh-auth-url:
    description: >-
      OVH Keystone v3 URL. Defaults to https://auth.cloud.ovh.us/v3, the OVH US
      account's; an EU account needs https://auth.cloud.ovh.net/v3. The
      credential is sent here, so it must be https.
    required: false
  github-token:
    description: >-
      Token that can manage this repo's runners (fine-grained PAT with
      Administration read and write, and Actions read). The workflow's own GITHUB_TOKEN cannot.
      Pass it from a secret.
    required: true
  runner-count:
    description: Runners per server. Defaults to 3.
    required: false
  image:
    description: Server image. Defaults to ubuntu-24.04 on Hetzner and "Ubuntu 24.04" on OVH.
    required: false
  location:
    description: >-
      Server location. On Hetzner it defaults to nbg1; on OVH it is the region
      and defaults to US-EAST-VA-1.
    required: false
  run-id:
    description: >-
      The workflow run that owns the server; pass the run's id from the github
      context. With it, this run gets its OWN server, never another run's: the run id is part of the server's identity and is recorded on it (label vgr-run), the runner labels gain run-<id>, and the runs_on output returns labels only this run's runners have. The pool label stays, so a scheduled reaper over the pool still finds it. A re-run of the same run id reuses the previous attempt's server if it still exists, else creates a new one. Leave it unset for the shared-pool mode, where every run of the repo shares one server. Each per-run server needs a slot in the project quota; ensure fails at once, naming the quota, when there is none.
    required: false
  runner-labels:
    description: >-
      Comma-separated runner labels. Defaults to "vm-gh-runners,pool-<pool>",
      plus run-<run-id> when run-id is set (it is appended to a list you give if
      missing, so runs cannot share runners). These are the runners' ONLY labels:
      they are registered with --no-default-labels, so they do not carry
      self-hosted, Linux or X64, and a job that targets self-hosted cannot land
      on them. Naming one of those three here is an error.
    required: false
  runner-version:
    description: >-
      Runner version such as 2.337.0, or "latest" (the default). Pin it for
      repeatable builds. At least 2.305.0, the first with --no-default-labels.
    required: false
  extra-packages:
    description: Comma-separated extra apt packages the jobs need.
    required: false

outputs:
  server_id:
    description: ID of the server the jobs will run on.
    value: ${{ steps.cli.outputs.server_id }}
  server_name:
    description: Name of that server.
    value: ${{ steps.cli.outputs.server_name }}
  created:
    description: "true if this call created the server, false if it reused one."
    value: ${{ steps.cli.outputs.created }}
  registered:
    description: Number of runners this call registered or repaired.
    value: ${{ steps.cli.outputs.registered }}
  runs_on:
    description: >-
      JSON array of labels for the jobs that should use the VM: exactly the
      runners' labels, without self-hosted. With run-id set, they match only
      this run's runners. Pass it
      through the fromJSON function in a later job's runs-on (see
      examples/use-in-a-workflow.yml). It is not written out as an expression
      here because GitHub evaluates expressions in action descriptions.
    value: ${{ steps.cli.outputs.runs_on }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13
    - id: cli
      shell: bash
      # Everything reaches the CLI through env, never by interpolating into the
      # script: a value pasted into `run:` is parsed as shell.
      env:
        ACTION_PATH: ${{ github.action_path }}
        VGR_PROVIDER: ${{ inputs.provider }}
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        OS_APPLICATION_CREDENTIAL_ID: ${{ inputs.ovh-application-credential-id }}
        OS_APPLICATION_CREDENTIAL_SECRET: ${{ inputs.ovh-application-credential-secret }}
        OS_AUTH_URL: ${{ inputs.ovh-auth-url }}
        VGR_GITHUB_TOKEN: ${{ inputs.github-token }}
        VGR_POOL: ${{ inputs.pool }}
        VGR_SERVER_TYPE: ${{ inputs.server-type }}
        VGR_SSH_KEY_NAMES: ${{ inputs.ssh-key-names }}
        VGR_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        VGR_RUNNER_COUNT: ${{ inputs.runner-count }}
        VGR_IMAGE: ${{ inputs.image }}
        VGR_LOCATION: ${{ inputs.location }}
        VGR_RUN_ID: ${{ inputs.run-id }}
        VGR_RUNNER_LABELS: ${{ inputs.runner-labels }}
        VGR_RUNNER_VERSION: ${{ inputs.runner-version }}
        VGR_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: bun "$ACTION_PATH/../src/cli.ts" ensure
