name: vm-gh-runners reap
description: >-
  Delete the pool's idle servers: as soon as they are idle on OVH, which bills
  by runtime, and in the last minutes of their paid hour on Hetzner, which
  bills per started hour. With run-id it deletes just that run's per-run server
  at once (a run's teardown job); without it, run it on a schedule (every 5
  minutes on Hetzner, every 30 on OVH) from the consuming repo as the safety
  net that also removes per-run servers whose run is over.

inputs:
  pool:
    description: The pool whose servers to consider. Must match the one given to ensure.
    required: true
  run-id:
    description: >-
      Tear down only the server this run's ensure made with the same run-id (pass
      the run's id from the github context). Use it in the run's last job, which
      is not counted as an active run. The repo's other runs are ignored, since
      they have servers of their own. The per-run server is deleted as soon as no
      runner on it is busy, on any provider. Leave it unset for the scheduled
      sweep: a per-run server is then kept while its run is queued or in
      progress and deleted once the run is finished or gone, and shared-pool
      servers are handled as before.
    required: false
  max-age-minutes:
    description: >-
      Sweep only (no run-id): delete a per-run server older than this many
      minutes whatever its run is doing, even with a busy runner, so a stuck run
      cannot hold a server forever. Unset means no limit.
    required: false
  provider:
    description: >-
      Cloud to run on, ovh or hetzner. Defaults to ovh. Each needs its own
      credentials, below; the other provider's can be left unset. A caller that
      uses Hetzner must set this to hetzner.
    required: false
  hcloud-token:
    description: Hetzner project API token (read and write). Required when provider is hetzner. Pass it from a secret.
    required: false
  ovh-application-credential-id:
    description: >-
      ID of an OVH application credential created as unrestricted, so it can
      create and delete servers. Required when provider is ovh.
    required: false
  ovh-application-credential-secret:
    description: Secret of that OVH application credential. Required when provider is ovh. Pass it from a secret.
    required: false
  ovh-auth-url:
    description: >-
      OVH Keystone v3 URL. Defaults to https://auth.cloud.ovh.us/v3, the OVH US
      account's; an EU account needs https://auth.cloud.ovh.net/v3. The
      credential is sent here, so it must be https.
    required: false
  location:
    description: >-
      OVH region (such as US-EAST-VA-1) whose servers to consider; it must match
      the one given to ensure. Defaults to US-EAST-VA-1. Ignored for Hetzner,
      which lists the whole project.
    required: false
  github-token:
    description: >-
      Token that can manage this repo's runners (fine-grained PAT with
      Administration read and write, and Actions read). Pass it from a secret.
    required: true
  window-start-minute:
    description: >-
      Hetzner only: minute of each paid hour (0-59) from which an idle server may
      be deleted. Defaults to 50. Lower it if the reaper runs less often than
      every 5 minutes. Setting it with provider ovh is an error, since there is
      no paid hour to wait out.
    required: false

outputs:
  deleted:
    description: Number of servers deleted.
    value: ${{ steps.cli.outputs.deleted }}
  kept:
    description: Number of servers left running.
    value: ${{ steps.cli.outputs.kept }}
  errors:
    description: Number of servers that could not be handled. The step also fails if this is above zero.
    value: ${{ steps.cli.outputs.errors }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13
    - id: cli
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        VGR_PROVIDER: ${{ inputs.provider }}
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        OS_APPLICATION_CREDENTIAL_ID: ${{ inputs.ovh-application-credential-id }}
        OS_APPLICATION_CREDENTIAL_SECRET: ${{ inputs.ovh-application-credential-secret }}
        OS_AUTH_URL: ${{ inputs.ovh-auth-url }}
        VGR_LOCATION: ${{ inputs.location }}
        VGR_GITHUB_TOKEN: ${{ inputs.github-token }}
        VGR_POOL: ${{ inputs.pool }}
        VGR_RUN_ID: ${{ inputs.run-id }}
        VGR_MAX_AGE_MINUTES: ${{ inputs.max-age-minutes }}
        VGR_WINDOW_START_MINUTE: ${{ inputs.window-start-minute }}
      run: bun "$ACTION_PATH/../src/cli.ts" reap
